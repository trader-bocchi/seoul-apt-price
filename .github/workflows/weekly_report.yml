name: Weekly Apartment Price Report

on:
  schedule:
    - cron: '30 23 * * 0,3,5'  # 월/목/토 08:30 KST (= UTC 전날 23:30)
  workflow_dispatch:        # 수동 실행 허용

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGION_NAME: ${{ vars.REGION_NAME }}
          MY_HOME_COMPLEX_NAME: ${{ vars.MY_HOME_COMPLEX_NAME }}
          MY_HOME_COMPLEX_AREA: ${{ vars.MY_HOME_COMPLEX_AREA }}
          TARGET_HOME_COMPLEX_NAME: ${{ vars.TARGET_HOME_COMPLEX_NAME }}
          FILTER_DPRC_MIN: ${{ vars.FILTER_DPRC_MIN }}
          FILTER_DPRC_MAX: ${{ vars.FILTER_DPRC_MAX }}
          FILTER_SPC_MIN: ${{ vars.FILTER_SPC_MIN }}
          FILTER_SPC_MAX: ${{ vars.FILTER_SPC_MAX }}
        run: python scripts/run_pipeline.py
